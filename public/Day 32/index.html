<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Social Media Dashboard | Analytics at a Glance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Monitor your social media growth and daily engagement with this sleek analytics dashboard.">
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="SocialInsights | Performance Dashboard">
  <meta property="og:description"
    content="Track followers and activity across multiple platforms in one centralized view.">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SocialInsights | Performance Dashboard">
  <meta name="twitter:description"
    content="Track followers and activity across multiple platforms in one centralized view.">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="header">
    <h1>📊 Social Media Dashboard</h1>
    <button id="themeToggle">🌙 Dark Mode</button>
  </header>

  <section class="overview">
    <div class="card facebook">
      <h3>Facebook</h3>
      <p class="count" id="fbFollowers">0</p>
      <span>Followers</span>
    </div>

    <div class="card twitter">
      <h3>Twitter</h3>
      <p class="count" id="twFollowers">0</p>
      <span>Followers</span>
    </div>

    <div class="card instagram">
      <h3>Instagram</h3>
      <p class="count" id="igFollowers">0</p>
      <span>Followers</span>
    </div>

    <div class="card youtube">
      <h3>YouTube</h3>
      <p class="count" id="ytSubscribers">0</p>
      <span>Subscribers</span>
    </div>
  </section>

  <section class="activity">
    <h2>📈 Today's Activity</h2>

    <div class="activity-card">
      <span>👍 Likes</span>
      <strong>1,240</strong>
    </div>

    <div class="activity-card">
      <span>💬 Comments</span>
      <strong>430</strong>
    </div>

    <div class="activity-card">
      <span>🔁 Shares</span>
      <strong>310</strong>
    </div>

    <div class="activity-card">
      <span>👀 Views</span>
      <strong>18,600</strong>
    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>

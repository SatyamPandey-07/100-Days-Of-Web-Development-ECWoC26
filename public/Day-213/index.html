<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Sandbox | Verlet Engine</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/hud.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <aside id="toolbar">
            <header>
                <h1>PhysiX</h1>
                <p>Sandbox v1.0</p>
            </header>

            <div class="tool-section">
                <h3>Entities</h3>
                <div class="tool-grid">
                    <button class="tool-btn active" data-tool="circle" title="Create Circle">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <circle cx="12" cy="12" r="8" stroke="currentColor" fill="none" stroke-width="2" />
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="box" title="Create Box">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <rect x="5" y="5" width="14" height="14" stroke="currentColor" fill="none"
                                stroke-width="2" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="tool-section">
                <h3>Interactions</h3>
                <div class="tool-grid">
                    <button class="tool-btn" data-tool="drag" title="Drag Objects">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path d="M7 10l5-5 5 5M7 14l5 5 5-5" stroke="currentColor" fill="none" stroke-width="2" />
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="link" title="Create Constraints">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path d="M8 12h8M6 12a2 2 0 100-4 2 2 0 000 4zM18 12a2 2 0 100-4 2 2 0 000 4z"
                                stroke="currentColor" fill="none" stroke-width="2" />
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="explode" title="Explosion Tool">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"
                                stroke="currentColor" fill="none" stroke-width="2" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="tool-section">
                <h3>Environment</h3>
                <div class="control-row">
                    <label>Gravity</label>
                    <input type="range" id="gravity-slider" min="-1" max="1" step="0.1" value="0.5">
                </div>
                <div class="control-row">
                    <label>Friction</label>
                    <input type="range" id="friction-slider" min="0.9" max="1" step="0.001" value="0.99">
                </div>
                <div class="control-row">
                    <label>Bounce</label>
                    <input type="range" id="bounce-slider" min="0" max="1" step="0.1" value="0.8">
                </div>
            </div>

            <footer class="actions">
                <div class="export-row">
                    <button id="save-snap">Save Snap</button>
                    <button id="load-snap">Load Snap</button>
                </div>
                <button id="clear-btn">Clear All</button>
                <button id="pause-btn">Pause</button>
            </footer>
        </aside>

        <main id="viewport">
            <canvas id="physics-canvas"></canvas>

            <div id="hud">
                <div class="stat-item">FPS: <span id="fps-val">0</span></div>
                <div class="stat-item">Bodies: <span id="bodies-val">0</span></div>
                <div class="stat-item">Collisions: <span id="cols-val">0</span></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="scripts/bodies.js"></script>
    <script src="scripts/constraints.js"></script>
    <script src="scripts/collision.js"></script>
    <script src="scripts/particles.js"></script>
    <script src="scripts/quadtree.js"></script>
    <script src="scripts/engine.js"></script>
    <script src="scripts/input.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('physics-canvas');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            const engine = new PhysicsEngine(canvas);
            const input = new InputHandler(engine);

            // UI Binding
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelector('.tool-btn.active').classList.remove('active');
                    btn.classList.add('active');
                    input.setTool(btn.dataset.tool);
                };
            });

            document.getElementById('gravity-slider').oninput = (e) => {
                engine.gravity.y = parseFloat(e.target.value);
            };

            document.getElementById('friction-slider').oninput = (e) => {
                engine.friction = parseFloat(e.target.value);
            };

            document.getElementById('bounce-slider').oninput = (e) => {
                engine.restitution = parseFloat(e.target.value);
            };

            document.getElementById('pause-btn').onclick = (e) => {
                engine.isPaused = !engine.isPaused;
                e.target.textContent = engine.isPaused ? 'Resume' : 'Pause';
            };

            document.getElementById('clear-btn').onclick = () => {
                engine.bodies = [];
                engine.constraints = [];
            };

            document.getElementById('save-snap').onclick = () => {
                if (engine.saveSnapshot()) alert('Snapshot saved!');
            };

            document.getElementById('load-snap').onclick = () => {
                if (engine.loadSnapshot()) alert('Snapshot loaded!');
                else alert('No snapshot found.');
            };

            // HUD Update
            setInterval(() => {
                document.getElementById('fps-val').textContent = engine.stats.fps;
                document.getElementById('bodies-val').textContent = engine.stats.bodyCount;
                document.getElementById('cols-val').textContent = engine.stats.collisionCount;
            }, 500);

            engine.start();

            window.onresize = () => {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
                engine.width = canvas.width;
                engine.height = canvas.height;
            };
        });
    </script>
</body>

</html>
